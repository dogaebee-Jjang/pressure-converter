<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6b78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="압력 변환기">
<link rel="apple-touch-icon" href="icon-192.png">
<title>압력 변환기</title>
<style>
:root{
  --bg:#e9f0f1; --surface:#fbfdfd; --ink:#12262b; --muted:#5b7076; --line:#c5d4d7; --accent:#0b6b78; --accent-soft:#d3ebee;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a1d; --surface:#15262a; --ink:#e6f1f2; --muted:#93a9ae; --line:#2b4247; --accent:#5cc4d1; --accent-soft:#1b3b41;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a1d; --surface:#15262a; --ink:#e6f1f2; --muted:#93a9ae; --line:#2b4247; --accent:#5cc4d1; --accent-soft:#1b3b41;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:1.5rem;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
p.lead{margin:0 0 22px;color:var(--muted);font-size:.95rem;line-height:1.6}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px 6px 4px 16px;transition:border-color .15s, background .15s}
.row:focus-within{border-color:var(--accent);background:var(--accent-soft)}
.row input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums;text-align:right;padding:14px 12px 14px 8px;outline:none}
.sci{flex:0 0 auto;min-width:5.4em;text-align:center;padding:8px 8px;background:var(--bg);border-radius:8px;color:var(--ink);font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sci sup{font-size:.7em}
.sci .u{font-size:.8em;font-weight:500;color:var(--muted)}
@media (max-width:430px){
  .row{flex-wrap:wrap}
  .sci{flex:0 0 auto;margin-top:8px;text-align:left}
  .row input{flex:1 1 0}
}
.row input::placeholder{color:var(--line)}
.row label{flex:0 0 auto;min-width:64px;white-space:nowrap;text-align:right;font-weight:700;font-size:1.05rem;color:var(--accent);padding:0 10px 0 8px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
button{font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,.row input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ref{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink);font-weight:700;font-size:1.05rem;line-height:1.8;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>압력 변환기</h1>
  <p class="lead">아무 단위에나 값을 입력하면 나머지 단위가 바로 계산됩니다.</p>
  <div class="rows" id="rows"></div>
  <div class="actions"><button type="button" id="clear">모두 지우기</button></div>
  <div class="ref">1 atm = 101.325 kPa = 760 torr = 1013.25 mbar = 14.6959 psi = 1.03323 kgf/cm²</div>
</main>
<script>
(function(){
  var units=[
    {id:'atm',f:101325},
    {id:'kPa',f:1000},
    {id:'torr',f:101325/760},
    {id:'mbar',f:100},
    {id:'psi',f:6894.757293168},
    {id:'kgf/cm²',f:98066.5}
  ];
  var rows=document.getElementById('rows');
  var inputs={},sciEls={};

  units.forEach(function(u){
    var row=document.createElement('div');row.className='row';
    var sci=document.createElement('div');sci.className='sci';sci.setAttribute('aria-hidden','true');sci.textContent='–';sciEls[u.id]=sci;
    var inp=document.createElement('input');
    inp.type='text';inp.inputMode='decimal';inp.id='in-'+u.id;inp.placeholder='0';
    inp.autocomplete='off';inp.setAttribute('aria-label',u.id+' 값');
    var lab=document.createElement('label');lab.htmlFor=inp.id;lab.textContent=u.id;
    row.appendChild(sci);row.appendChild(inp);row.appendChild(lab);rows.appendChild(row);
    inputs[u.id]=inp;
    inp.addEventListener('input',function(){update(u)});
  });

  var SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
  var UNSUP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};
  function sup(e){return String(e).split('').map(function(c){return SUP[c]}).join('')}

  function parse(raw){
    var t=raw.replace(/,/g,'').replace(/[⁰¹²³⁴-⁹⁻]+/g,function(m){
      return '^'+m.split('').map(function(c){return UNSUP[c]}).join('');
    });
    t=t.replace(/\s*[×x*]\s*10\s*\^\s*([+-]?\d+)\s*$/i,'e$1').replace(/\s+/g,'');
    return t===''?NaN:Number(t);
  }

  function fmt(n){
    if(n===0)return '0.000000 × 10⁰';
    var s=n.toExponential(6).split('e');
    return s[0]+' × 10'+sup(parseInt(s[1],10));
  }

  function sciFmt(n){
    if(n===0)return '0.0 × 10<sup>0</sup>';
    var s=n.toExponential(1).split('e');
    var e=parseInt(s[1],10);
    return s[0]+' × 10<sup>'+(e<0?'−'+(-e):e)+'</sup>';
  }

  function update(src){
    var raw=inputs[src.id].value.replace(/,/g,'').trim();
    var v=parse(raw);
    var pa=v*src.f;
    units.forEach(function(u){
      sciEls[u.id].innerHTML=isFinite(pa)?sciFmt(pa/u.f)+' <span class="u">'+u.id+'</span>':'–';
      if(u.id===src.id)return;
      inputs[u.id].value=isFinite(pa)?fmt(pa/u.f):'';
    });
  }

  document.getElementById('clear').addEventListener('click',function(){
    units.forEach(function(u){inputs[u.id].value='';sciEls[u.id].textContent='–'});
    inputs.atm.focus();
  });
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
